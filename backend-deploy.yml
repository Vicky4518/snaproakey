 trigger:
 - main

 pool:
   vmImage: 'ubuntu-latest'

   variables:
     backendPath: 'backend'

     steps:

     - task: NodeTool@0
       inputs:
           versionSpec: '18.x'
             displayName: 'Install Node.js'

             - script: |
                 cd $(backendPath)
                     npm install
                       displayName: 'Install Backend Dependencies'

                       - script: |
                           cd $(backendPath)
                               npm run build
                                 displayName: 'Build Backend'

                                 - task: ArchiveFiles@2
                                   inputs:
                                       rootFolderOrFile: '$(backendPath)'
                                           includeRootFolder: false
                                               archiveType: 'zip'
                                                   archiveFile: '$(Build.ArtifactStagingDirectory)/backend.zip'
                                                       replaceExistingArchive: true
                                                         displayName: 'Archive Backend'

                                                         - task: PublishBuildArtifacts@1
                                                           inputs:
                                                               PathtoPublish: '$(Build.ArtifactStagingDirectory)/backend.zip'
                                                                   ArtifactName: 'backend-drop'
                                                                     displayName: 'Publish Backend Artifact'

                                                                     - task: AzureWebApp@1
                                                                       inputs:
                                                                           azureSubscription: 'YOUR_SERVICE_CONNECTION'
                                                                               appName: 'snaproakey-api'
                                                                                   package: '$(Build.ArtifactStagingDirectory)/backend.zip'
                                                                                     displayName: 'Deploy Backend to Azure'